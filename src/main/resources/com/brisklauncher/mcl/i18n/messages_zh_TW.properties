network.notice.intro=下面幾項是啟動器唯一會連網的地方；前兩項可以在這裡或「設定」裡關掉，第三項只在下載遊戲檔案時發生。除此之外不會上傳任何東西。
network.notice.crash_rules_desc=每天最多一次，從專案的 GitHub 倉庫下載崩潰規則（不含任何個人資料）。
network.notice.update_desc=啟動時查一次是否有新版本；只有你按下更新才會下載。
network.notice.speedtest_desc=下載遊戲檔案時會測一下映象速度，用來挑比較快的那個（只連映象網站本身）。
network.notice.privacy=隱私：啟動器不收集賬號資訊、不上傳日誌。登入只與微軟或你指定的認證伺服器通訊。
network.notice.ok=瞭解並繼續
network.notice.later=稍後再說

