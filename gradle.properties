# ============================================================
#  Brisk Launcher · Gradle 属性
#  推荐 Gradle 8.10.2（Java 21 toolchain）
# ============================================================

# 构建进程内存：启动器本身不大，1G 足够
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# 并行 + 构建缓存（明显缩短二次构建）
# 暂不开启 configuration-cache：javafx 插件对它的支持还不稳定
org.gradle.parallel=true
org.gradle.caching=true

# 控制台输出带颜色，方便看错误
org.gradle.console=rich

# 只在需要时自动下载 toolchain 21
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true

# ------------------------------------------------------------
# 注意：Gradle 自己的依赖缓存（GRADLE_USER_HOME）默认在
#   C:/Users/<你>/.gradle
# 如果不想占用 C 盘，请在拉取前设置环境变量（PowerShell）：
#   $env:GRADLE_USER_HOME = 'E:\code\Brisk_Launcher\.cache\gradle'
# gradle.properties 不能覆盖 GRADLE_USER_HOME，只能用环境变量或 -g 参数。
# ------------------------------------------------------------
